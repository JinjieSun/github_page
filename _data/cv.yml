  summary: >
    Robotics and machine learning researcher with experience in vision-based autonomy,
    imitation learning, diffusion policies, privileged multimodal distillation, and
    sim-to-real transfer. Developed end-to-end robotic systems spanning Unity simulation,
    synthetic data generation, PyTorch policy training, ROS 2 integration, and physical
    robot evaluation. M.Sc. degree requirements completed at the University of Toronto;
    formal conferral expected Fall 2026.

