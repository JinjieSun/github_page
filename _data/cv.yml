    Experience:
      - company: Continuum Robotics Laboratory | Medical Computer Vision and Robotics Lab , University of Toronto
        position: Graduate Researcher
        location: Toronto, On, Canada
        start_date: 2022-09
        end_date: 2026
        summary: >
          Conducted research on vision-based autonomy and robot learning for concentric
          tube continuum robots, with emphasis on autonomous surgical liquid removal.
        highlights:
          - Developed end-to-end autonomy pipelines integrating visual perception, task-space motion prediction, robot control, and real-time experimental evaluation.
          - Built a Unity simulation platform with photorealistic rendering, liquid interaction, synthetic data generation, and domain randomization.
          - Implemented imitation-learning and diffusion-policy pipelines in PyTorch and Hugging Face LeRobot.
          - Integrated learned policies and model-based controllers with ROS 2 and physical continuum-robot hardware.
          - Designed simulation and real-world evaluations under changes in tissue appearance, liquid visibility, and initial robot configuration.

    Projects:
      - name: Privileged Multimodal Distillation for RGB-Only Diffusion Policy
        start_date: 2025
        end_date: 2026
        summary: >
          Developed a teacher-student framework that transfers knowledge from policies
          trained with privileged segmentation and depth observations to an RGB-only
          diffusion policy for autonomous liquid removal.
        highlights:
          - Designed complementary action, noise-prediction, feature, and temporal-feature distillation objectives.
          - Trained and evaluated RGB-only policies across multiple simulated tissue scenes and visual conditions.
          - Deployed the learned policies on a physical CTCR platform using microscope RGB observations and ROS 2.
          - Compared distilled policies with standard and augmentation-based Diffusion Policy baselines in simulation and real-world trials.

      - name: Vision-Based Autonomous Liquid Removal with a Concentric Tube Continuum Robot
        start_date: 2023
        end_date: 2025
        summary: >
          Developed a vision-based autonomous liquid-removal system combining image-based
          targeting, differential inverse kinematics, and lookup-table recovery for a
          concentric tube continuum robot.
        highlights:
          - Developed both a Unity-based robot-liquid simulator and a physical benchtop experimental platform.
          - Integrated segmentation, target selection, robot control, and suction into a closed-loop system operating at 4–7 Hz.
          - Achieved over 99% liquid removal across 32 simulated trials and less than 0.1 g remaining liquid in typical real-world trials.
          - Published and presented the work at the 22nd Conference on Robots and Vision (CRV 2025).

    Publications:
      - title: Vision-Based Autonomous Blood Suction with a Concentric Tube Continuum Robot
        authors:
          - Jinjie Sun
          - Courtney Amm
          - Jessica Burgner-Kahrs
          - Lueder A. Kahrs
        publisher: Proceedings of the 22nd Conference on Robots and Vision (CRV)
        releaseDate: 2025-05-27
        url: https://crv.pubpub.org/pub/aw3sejjr
        summary: >
          A vision-based control framework for autonomous liquid suction using a concentric
          tube continuum robot, evaluated through simulation and physical experiments.

