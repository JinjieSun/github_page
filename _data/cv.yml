    Projects:
      - name: Privileged Multimodal Distillation for RGB-Only Diffusion Policy
        start_date: 2025
        end_date: 2026
        summary: >
          Developed a teacher-student framework that transfers knowledge from policies
          trained with privileged segmentation and depth observations to an RGB-only
          diffusion policy for autonomous liquid removal.
  
      - name: Vision-Based Autonomous Liquid Removal with a Concentric Tube Continuum Robot
        start_date: 2023
        end_date: 2025
        summary: >
          Developed a vision-based autonomous liquid-removal system combining image-based
          targeting, differential inverse kinematics, and lookup-table recovery for a
          concentric tube continuum robot.


    Publications:
      - title: Vision-Based Autonomous Blood Suction with a Concentric Tube Continuum Robot
        authors:
          - Jinjie Sun
          - Courtney Amm
          - Jessica Burgner-Kahrs
          - Lueder A. Kahrs
        publisher: Proceedings of the 22nd Conference on Robots and Vision (CRV)
        releaseDate: 2025-05-27
        url: https://crv.pubpub.org/pub/aw3sejjr
        summary: >
          A vision-based control framework for autonomous liquid suction using a concentric
          tube continuum robot, evaluated through simulation and physical experiments.

